<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="dispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Body -->
  <rect x="24" y="24" width="208" height="208" rx="40" fill="url(#bgGrad)" stroke="#292e42" stroke-width="4"/>

  <!-- Screen Display -->
  <rect x="44" y="44" width="168" height="52" rx="14" fill="url(#dispGrad)" stroke="#24283b" stroke-width="2"/>
  
  <!-- Screen Text Placeholder -->
  <text x="198" y="80" text-anchor="end" font-family="monospace" font-size="24" font-weight="bold" fill="#00d2ff" filter="url(#glow)">42</text>

  <!-- Button Grid Preview -->
  <!-- Row 1 -->
  <rect x="44" y="112" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="62" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">7</text>

  <rect x="88" y="112" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="106" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">8</text>

  <rect x="132" y="112" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="150" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">9</text>

  <rect x="176" y="112" width="36" height="28" rx="8" fill="#292e42"/>
  <text x="194" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7aa2f7">÷</text>

  <!-- Row 2 -->
  <rect x="44" y="148" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="62" y="167" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">4</text>

  <rect x="88" y="148" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="106" y="167" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">5</text>

  <rect x="132" y="148" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="150" y="167" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">6</text>

  <rect x="176" y="148" width="36" height="28" rx="8" fill="#292e42"/>
  <text x="194" y="167" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7aa2f7">×</text>

  <!-- Row 3 -->
  <rect x="44" y="184" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="62" y="203" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">1</text>

  <rect x="88" y="184" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="106" y="203" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">2</text>

  <rect x="132" y="184" width="36" height="28" rx="8" fill="#24283b"/>
  <text x="150" y="203" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0caf5">3</text>

  <!-- Big Equal Button -->
  <rect x="176" y="184" width="36" height="28" rx="8" fill="url(#cyanGrad)"/>
  <text x="194" y="204" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#15161e">=</text>
</svg>
